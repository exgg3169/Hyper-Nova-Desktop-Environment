name: HyperNova OS ISO

# Building the ISO takes a while and needs a privileged container,
# so it only runs on demand and for release tags.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install archiso
        run: pacman -Syu --noconfirm --needed archiso make git
      - uses: actions/checkout@v4
      - name: Build ISO
        run: ./iso/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hypernova-os-iso
          path: out/*.iso
          compression-level: 0
      - name: Attach ISO to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
