name: HyperNova OS ISO

# Building the ISO takes a while and needs a privileged container, so it
# only runs on demand, for releases and when the ISO profile changes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the output to this release tag, e.g. v0.1.0 (the tag and release are created if missing)'
        required: false
        default: ''
  push:
    branches: ['**']
    tags: ['v*']
    # Path filters apply to branch pushes only; every v* tag builds the ISO.
    paths: ['iso/**', '.github/workflows/iso.yml']

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install archiso
        run: pacman -Syu --noconfirm --needed archiso make git
      - uses: actions/checkout@v4
      - name: Build ISO
        run: ./iso/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hypernova-os-iso
          path: out/*.iso
          compression-level: 0
      - name: Attach ISO to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: HyperNova ${{ inputs.release_tag || github.ref_name }}
          files: out/*.iso
