name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the output to this release tag, e.g. v0.1.0 (the tag and release are created if missing)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: gradle assembleRelease lintRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk hypernova-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hypernova-launcher-apk
          path: android/hypernova-launcher.apk
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: HyperNova ${{ inputs.release_tag || github.ref_name }}
          files: android/hypernova-launcher.apk
