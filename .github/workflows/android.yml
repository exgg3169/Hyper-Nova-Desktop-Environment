name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: gradle assembleRelease lintRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk hypernova-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hypernova-launcher-apk
          path: android/hypernova-launcher.apk
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/hypernova-launcher.apk
